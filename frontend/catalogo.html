<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de productos · Santiago Filtros</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f2a47">
  <meta property="og:title" content="Catálogo de productos · Santiago Filtros">
  <meta property="og:description" content="Filtros y repuestos disponibles con código, marca y precio.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f2a47'/%3E%3Cpath d='M6 6h12l-4.5 6v4.5l-3 1.5v-6z' fill='%23f7500b'/%3E%3C/svg%3E">
  <!-- Base visual compartida con la página de cotización. -->
  <link rel="stylesheet" href="/css/cotizar.css">
  <link rel="stylesheet" href="/css/catalogo.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <span class="brand">
        <span class="brand-mark" data-logo><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16l-6 8v6l-4 2v-8z"/></svg></span>
        <span class="brand-name" data-empresa>Santiago Filtros</span>
      </span>
      <span class="topbar-tag">Catálogo de productos</span>
    </div>
  </header>

  <main class="wrap" id="app">
    <div class="state">
      <span class="spinner" aria-hidden="true"></span>
      <p>Cargando catálogo…</p>
    </div>
  </main>

  <template id="tpl-main">
    <section class="intro intro-row">
      <div>
        <h1>Catálogo de productos</h1>
        <p class="intro-sub" data-resumen></p>
      </div>
      <p class="vence" data-vence></p>
    </section>

    <div class="tools">
      <label class="search">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr-only">Buscar productos</span>
        <input type="search" data-search autocomplete="off" placeholder="Busca por código, vehículo o marca">
      </label>
      <div class="cats" role="group" aria-label="Filtrar por categoría" data-cats></div>
    </div>
    <p class="count" aria-live="polite" data-count></p>
    <ul class="catalog-grid" data-grid></ul>
    <div class="more"><button type="button" class="btn" data-more hidden>Mostrar más productos</button></div>
    <p class="catalog-note">Precios en pesos chilenos, IVA incluido. Sujetos a cambio sin previo aviso y a disponibilidad de stock.</p>
  </template>

  <script type="module" src="/js/catalogo-publico.js"></script>
</body>
</html>
